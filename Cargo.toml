[package]
name = "kiln"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kiln"
path = "src/main.rs"

[lib]
name = "kiln_compiler"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.6", features = ["derive"] }
cranelift-codegen = "0.131.1"
cranelift-frontend = "0.131.1"
cranelift-module = "0.131.1"
cranelift-native = "0.131.1"
cranelift-object = "0.131.1"
notify = "8.2.0"
thiserror = "2.0.18"

[dev-dependencies]
